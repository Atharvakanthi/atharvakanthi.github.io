  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

y:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:13px\">\n\n  <aside style=\"background:#1c1d1b;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 0 14px\">\n    <div style=\"padding:0 18px 16px\">\n      <div style=\"font-size:13.5px;font-weight:600;color:#f4f4f2;letter-spacing:-.01em\">Sri Lanka Property<\u002Fdiv>\n      <div style=\"font-size:11px;color:#84847c;margin-top:3px;letter-spacing:.01em\">Market EDA workbench<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"height:1px;background:#2f302b;margin-bottom:14px\"><\u002Fdiv>\n\n    <div style=\"padding:0 18px 7px;font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#63635c\">Channels<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ navSale.on }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:background .12s;background:{{ navSale.bg }};color:{{ navSale.fg }};border-left-color:{{ navSale.bd }};font-weight:{{ navSale.fw }}\" style-hover=\"background:#262723;color:#f4f4f2\">\n      <span style=\"width:15px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:{{ navSale.nm }}\">01<\u002Fspan>Real estate listing<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ navLtr.on }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:background .12s;background:{{ navLtr.bg }};color:{{ navLtr.fg }};border-left-color:{{ navLtr.bd }};font-weight:{{ navLtr.fw }}\" style-hover=\"background:#262723;color:#f4f4f2\">\n      <span style=\"width:15px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:{{ navLtr.nm }}\">02<\u002Fspan>Long-term rental<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ navStr.on }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:background .12s;background:{{ navStr.bg }};color:{{ navStr.fg }};border-left-color:{{ navStr.bd }};font-weight:{{ navStr.fw }}\" style-hover=\"background:#262723;color:#f4f4f2\">\n      <span style=\"width:15px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:{{ navStr.nm }}\">03<\u002Fspan>Short-term rental<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ navCross.on }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:background .12s;background:{{ navCross.bg }};color:{{ navCross.fg }};border-left-color:{{ navCross.bd }};font-weight:{{ navCross.fw }}\" style-hover=\"background:#262723;color:#f4f4f2\">\n      <span style=\"width:15px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:{{ navCross.nm }}\">04<\u002Fspan>Cross-section EDA<\u002Fdiv>\n\n    <div style=\"padding:18px 18px 7px;font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#63635c\">Deep dives<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ navMarket.on }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:background .12s;background:{{ navMarket.bg }};color:{{ navMarket.fg }};border-left-color:{{ navMarket.bd }};font-weight:{{ navMarket.fw }}\" style-hover=\"background:#262723;color:#f4f4f2\">\n      <span style=\"width:15px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:{{ navMarket.nm }}\">05<\u002Fspan>Micro-market profile<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ navLand.on }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:background .12s;background:{{ navLand.bg }};color:{{ navLand.fg }};border-left-color:{{ navLand.bd }};font-weight:{{ navLand.fw }}\" style-hover=\"background:#262723;color:#f4f4f2\">\n      <span style=\"width:15px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:{{ navLand.nm }}\">06<\u002Fspan>Land analysis<\u002Fdiv>\n\n    <div style=\"padding:18px 18px 7px;font-size:9.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:#63635c\">Utilities<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ navMap.on }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:background .12s;background:{{ navMap.bg }};color:{{ navMap.fg }};border-left-color:{{ navMap.bd }};font-weight:{{ navMap.fw }}\" style-hover=\"background:#262723;color:#f4f4f2\">\n      <span style=\"width:15px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:{{ navMap.nm }}\">GEO<\u002Fspan>Listing map<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ navData.on }}\" style=\"display:flex;align-items:center;gap:10px;padding:8px 18px;cursor:pointer;font-size:12.5px;border-left:2px solid transparent;transition:background .12s;background:{{ navData.bg }};color:{{ navData.fg }};border-left-color:{{ navData.bd }};font-weight:{{ navData.fw }}\" style-hover=\"background:#262723;color:#f4f4f2\">\n      <span style=\"width:15px;font-size:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:{{ navData.nm }}\">RAW<\u002Fspan>Raw data, export<\u002Fdiv>\n\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"padding:14px 18px 0;border-top:1px solid #2f302b;font-size:10.5px;line-height:1.6;color:#7a7a72\">\n      <div style=\"font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#c8c8c0\">{{ rowsInFilter }}<\u002Fdiv>\n      <div>rows in current filter<\u002Fdiv>\n      <div style=\"margin-top:8px;color:#5d5d56\">of {{ rowsTotal }} listings<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <main style=\"min-width:0;display:flex;flex-direction:column\">\n    <div style=\"position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid #e6e6e2;padding:12px 24px 13px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap\">\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">District<\u002Flabel>\n        <sc-raw-select value=\"{{ district }}\" sc-camel-on-change=\"{{ onDistrict }}\" style=\"height:30px;min-width:150px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff;color:#1c1d1b\">\n          <option value=\"\">All districts<\u002Foption>\n          <sc-for list=\"{{ districts }}\" as=\"d\" hint-placeholder-count=\"3\"><option value=\"{{ d }}\">{{ d }}<\u002Foption><\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px;position:relative\">\n        <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Market<\u002Flabel>\n        <input value=\"{{ mq }}\" sc-camel-on-change=\"{{ onMQ }}\" sc-camel-on-focus=\"{{ onMFocus }}\" sc-camel-on-blur=\"{{ onMBlur }}\" placeholder=\"All markets\" style=\"height:30px;width:176px;border:1px solid #dcdcd6;border-radius:5px;padding:0 8px;font-size:12.5px;background:#fff;color:#1c1d1b\">\n        <sc-if value=\"{{ mOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute;top:58px;left:0;z-index:60;width:236px;max-height:264px;overflow:auto;background:#fff;border:1px solid #dcdcd6;border-radius:6px;box-shadow:0 10px 28px rgba(28,29,27,.14);padding:4px\">\n            <div sc-camel-on-mouse-down=\"{{ onMClear }}\" style=\"padding:6px 8px;font-size:12px;color:#70706a;cursor:pointer;border-radius:4px\" style-hover=\"background:#f4f4f2\">All markets<\u002Fdiv>\n            <sc-for list=\"{{ marketMatches }}\" as=\"m\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-mouse-down=\"{{ m.on }}\" style=\"display:flex;justify-content:space-between;gap:10px;padding:6px 8px;font-size:12.5px;cursor:pointer;border-radius:4px;color:{{ m.fg }};font-weight:{{ m.fw }}\" style-hover=\"background:#f4f4f2\">\n                <span>{{ m.name }}<\u002Fspan><span style=\"color:#b5b5ad;font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace\">{{ m.n }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noMatches }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:10px 8px;font-size:11.5px;color:#a5a59d\">No market matches that name<\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Asset class<\u002Flabel>\n        <div style=\"display:flex;gap:5px;flex-wrap:wrap;height:30px;align-items:center\">\n          <sc-for list=\"{{ assetChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ c.on }}\" style=\"cursor:pointer;user-select:none;font-size:11.5px;padding:5px 9px;border-radius:20px;line-height:1;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};font-weight:{{ c.fw }}\">{{ c.name }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Price range, LKR<\u002Flabel>\n        <div style=\"display:flex;gap:6px;align-items:center\">\n          <input type=\"number\" value=\"{{ min }}\" sc-camel-on-change=\"{{ onMin }}\" placeholder=\"min\" style=\"height:30px;width:104px;border:1px solid #dcdcd6;border-radius:5px;padding:0 8px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff\">\n          <span style=\"color:#b5b5ad\">–<\u002Fspan>\n          <input type=\"number\" value=\"{{ max }}\" sc-camel-on-change=\"{{ onMax }}\" placeholder=\"max\" style=\"height:30px;width:104px;border:1px solid #dcdcd6;border-radius:5px;padding:0 8px;font-size:12.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Duplicates<\u002Flabel>\n        <sc-raw-select value=\"{{ dup }}\" sc-camel-on-change=\"{{ onDup }}\" style=\"height:30px;min-width:150px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff;color:#1c1d1b\">\n          <option value=\"0\">Keep flagged rows<\u002Foption>\n          <option value=\"1\">Exclude flagged rows<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Currency<\u002Flabel>\n        <sc-raw-select value=\"{{ cur }}\" sc-camel-on-change=\"{{ onCur }}\" style=\"height:30px;min-width:112px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff;color:#1c1d1b\">\n          <option value=\"LKR\">LKR (Rs)<\u002Foption><option value=\"USD\">USD ($)<\u002Foption><option value=\"INR\">INR (₹)<\u002Foption>\n        <\u002Fsc-raw-select>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:5px\">\n        <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Area unit<\u002Flabel>\n        <sc-raw-select value=\"{{ areaUnit }}\" sc-camel-on-change=\"{{ onAreaUnit }}\" style=\"height:30px;min-width:100px;border:1px solid #dcdcd6;border-radius:5px;pa px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Median nightly rate by market<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Top 20 markets by listing count<\u002Fdiv>\n              <div id=\"tBar\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Rate distribution by asset class<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Box = median and IQR, log scale<\u002Fdiv>\n              <div id=\"tBox\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Occupancy distribution<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Measured listings only<\u002Fdiv>\n              <div id=\"tOcc\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Rate against occupancy by market<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Bubble area scales with sample size<\u002Fdiv>\n              <div id=\"tScatter\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Listing volume by district<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Count of short-term listings in the current filter, top 12 districts<\u002Fdiv>\n              <div id=\"tVol\" style=\"height:320px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Supply mix by asset class<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Share of listing count, not value<\u002Fdiv>\n              <div id=\"tMix\" style=\"height:320px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Performance tiers<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Occupancy bands, measured listings only. The dataset carries no star or review-rating column<\u002Fdiv>\n              <div id=\"tTier\" style=\"height:320px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"font-size:12.5px;font-weight:600\">Distribution explorer<\u002Fdiv>\n            <div style=\"font-size:11px;color:#8a8a82;margin-bottom:12px\">Recomputed live on the current filter.<\u002Fdiv>\n            <div style=\"border:1px solid #e6e6e2;border-radius:6px;background:#fbfbfa;padding:12px 14px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap\">\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Variable<\u002Flabel>\n                <sc-raw-select value=\"{{ tVar }}\" sc-camel-on-change=\"{{ onTVar }}\" style=\"height:30px;min-width:180px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff\">\n                  <option value=\"price\">Nightly rate<\u002Foption><option value=\"occ\">Occupancy %<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Group by<\u002Flabel>\n                <sc-raw-select value=\"{{ tGroup }}\" sc-camel-on-change=\"{{ onTGroup }}\" style=\"height:30px;min-width:180px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff\">\n                  <option value=\"asset\">Asset class<\u002Foption><option value=\"market\">Market, top 10<\u002Foption><option value=\"district\">District<\u002Foption><option value=\"none\">No grouping<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"font-size:11px;color:#a5a59d;padding-bottom:8px\">Recomputed on {{ rowsInFilter }} filtered rows<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:16px;margin-top:14px\">\n              <div id=\"tExHist\" style=\"height:270px\"><\u002Fdiv>\n              <div id=\"tExBox\" style=\"height:270px\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow:auto;max-height:300px;margin-top:6px\"><sc-raw-table id=\"tExTable\" style=\"width:100%;border-collapse:collapse\"><\u002Fsc-raw-table><\u002Fdiv>\n          <\u002Fsection>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px\">\n              <div>\n                <div style=\"font-size:12.5px;font-weight:600\">Short-term rental statistics<\u002Fdiv>\n                <div style=\"font-size:11px;color:#8a8a82\">RevPAR proxy is median rate × median occupancy. Groups below n=10 are suppressed.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ onToggleSup }}\" style=\"cursor:pointer;user-select:none;font-size:11px;padding:5px 10px;border-radius:5px;border:1px solid {{ supBd }};background:{{ supBg }};color:{{ supFg }};white-space:nowrap\">{{ supLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow:auto;max-height:520px;margin-top:10px\"><sc-raw-table id=\"tTable\" style=\"width:100%;border-collapse:collapse\"><\u002Fsc-raw-table><\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n\n      <sc-if value=\"{{ isMarket }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap\">\n            <div>\n              <h1 style=\"font-size:20px;font-weight:600;letter-spacing:-.015em\">Micro-market profile<\u002Fh1>\n              <p style=\"font-size:12.5px;color:#70706a;margin-top:5px;max-width:760px;text-wrap:pretty\">What is actually on the market in one place: how many apartments, villas, land parcels and hotels are listed, how bedroom counts split inside each asset class, and how the three channels compare on the same stock.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:5px\">\n              <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Micro-market<\u002Flabel>\n              <sc-raw-select value=\"{{ dmMarket }}\" sc-camel-on-change=\"{{ onDmMarket }}\" style=\"height:32px;min-width:250px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:13px;background:#fff;color:#1c1d1b\">\n                <sc-for list=\"{{ dmOptions }}\" as=\"m\" hint-placeholder-count=\"6\"><option value=\"{{ m.k }}\">{{ m.label }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n              <div style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:12px 14px\">\n                <div style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">{{ k.l }}<\u002Fdiv>\n                <div style=\"font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;margin-top:6px;line-height:1.2;font-size:{{ k.fs }}\">{{ k.v }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#a5a59d;margin-top:3px\">{{ k.s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Asset class mix<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Listing count in {{ dmMarket }}<\u002Fdiv>\n              <div id=\"mkMix\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Channel mix<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Real estate against long-term and short-term rental supply<\u002Fdiv>\n              <div id=\"mkChan\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Bedroom mix<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Listings reporting a bedroom count<\u002Fdiv>\n              <div id=\"mkBhk\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Bedroom mix by asset class<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Stacked listing counts, where the bedroom count is reported<\u002Fdiv>\n              <div id=\"mkBhkStack\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px\">\n              <div>\n                <div style=\"font-size:12.5px;font-weight:600\">Asset class and bedroom breakdown<\u002Fdiv>\n                <div style=\"font-size:11px;color:#8a8a82\">Each price column is suppressed on its own sample: a median appears only once that metric reaches n=10 in the cell.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ onToggleSup }}\" style=\"cursor:pointer;user-select:none;font-size:11px;padding:5px 10px;border-radius:5px;border:1px solid {{ supBd }};background:{{ supBg }};color:{{ supFg }};white-space:nowrap\">{{ supLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow:auto;max-height:520px;margin-top:10px\"><sc-raw-table id=\"mkTable\" style=\"width:100%;border-collapse:collapse\"><\u002Fsc-raw-table><\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isLand }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <h1 style=\"font-size:20px;font-weight:600;letter-spacing:-.015em\">Land analysis<\u002Fh1>\n            <p style=\"font-size:12.5px;color:#70706a;margin-top:5px;max-width:820px;text-wrap:pretty\">Land and farmland listings on the real estate channel, priced by {{ ppLabel }} so plots of different sizes can be compared. Rows without a usable plot size are excluded from these figures and counted separately.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n              <div style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:12px 14px\">\n                <div style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">{{ k.l }}<\u002Fdiv>\n                <div style=\"font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;margin-top:6px;line-height:1.2;font-size:{{ k.fs }}\">{{ k.v }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#a5a59d;margin-top:3px\">{{ k.s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Land supply by market<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Listing count, top 14 markets, with median {{ ppLabelLower }}<\u002Fdiv>\n              <div id=\"lnMk\" style=\"height:380px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Land against farmland<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Share of land listing count<\u002Fdiv>\n              <div id=\"lnSplit\" style=\"height:380px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">{{ ppLabel }} distribution<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">All land listings with a usable plot size<\u002Fdiv>\n              <div id=\"lnPerchHist\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Median {{ ppLabel }} by plot size<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Larger plots usually trade at a discount per unit<\u002Fdiv>\n              <div id=\"lnBand\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Median {{ ppLabel }} by district<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Districts with at least 10 priced land listings<\u002Fdiv>\n              <div id=\"lnDist\" style=\"height:340px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Plot size against total price<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Sampled, log–log<\u002Fdiv>\n              <div id=\"lnScatter\" style=\"height:340px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px\">\n              <div>\n                <div style=\"font-size:12.5px;font-weight:600\">Land statistics by market<\u002Fdiv>\n                <div style=\"font-size:11px;color:#8a8a82\">{{ ppLabel }} is the headline metric. Markets below n=10 are suppressed.<\u002Fdiv>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ onToggleSup }}\" style=\"cursor:pointer;user-select:none;font-size:11px;padding:5px 10px;border-radius:5px;border:1px solid {{ supBd }};background:{{ supBg }};color:{{ supFg }};white-space:nowrap\">{{ supLabel }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"overflow:auto;max-height:520px;margin-top:10px\"><sc-raw-table id=\"lnTable\" style=\"width:100%;border-collapse:collapse\"><\u002Fsc-raw-table><\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isCross }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <div style=\"display:flex;align-items:baseline;gap:10px\">\n              <h1 style=\"font-size:20px;font-weight:600;letter-spacing:-.015em\">Cross-section EDA<\u002Fh1>\n              <span style=\"font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#8a8a82;white-space:nowrap\">{{ rowsInFilter }} rows<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size:12.5px;color:#70706a;margin-top:5px;max-width:820px;text-wrap:pretty\">Cross-channel comparison is statistically solid only where real estate, long-term and short-term samples each reach n≥30 in the same market. Thinner markets stay visible and are flagged.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n              <div style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:12px 14px\">\n                <div style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">{{ k.l }}<\u002Fdiv>\n                <div style=\"font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;margin-top:6px;line-height:1.2;font-size:{{ k.fs }}\">{{ k.v }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#a5a59d;margin-top:3px\">{{ k.s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"font-size:12.5px;font-weight:600\">Correlation explorer<\u002Fdiv>\n            <div style=\"font-size:11px;color:#8a8a82;margin-bottom:12px\">Pearson r computed live on the current filter. Raw data contains genuine entry errors, so the outlier control matters.<\u002Fdiv>\n            <div style=\"border:1px solid #e6e6e2;border-radius:6px;background:#fbfbfa;padding:12px 14px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap\">\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Channel<\u002Flabel>\n                <sc-raw-select value=\"{{ cChan }}\" sc-camel-on-change=\"{{ onCChan }}\" style=\"height:30px;min-width:130px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff\">\n                  <option value=\"SALE\">Real estate listing<\u002Foption><option value=\"LTR\">Long-term rental<\u002Foption><option value=\"STR\">Short-term rental<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">X variable<\u002Flabel>\n                <sc-raw-select value=\"{{ cX }}\" sc-camel-on-change=\"{{ onCX }}\" style=\"height:30px;min-width:150px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ chanVars }}\" as=\"v\" hint-placeholder-count=\"2\"><option value=\"{{ v.k }}\">{{ v.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Y variable<\u002Flabel>\n                <sc-raw-select value=\"{{ cY }}\" sc-camel-on-change=\"{{ onCY }}\" style=\"height:30px;min-width:150px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff\">\n                  <sc-for list=\"{{ chanVars }}\" as=\"v\" hint-placeholder-count=\"2\"><option value=\"{{ v.k }}\">{{ v.label }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Colour by<\u002Flabel>\n                <sc-raw-select value=\"{{ cColor }}\" sc-camel-on-change=\"{{ onCColor }}\" style=\"height:30px;min-width:130px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff\">\n                  <option value=\"asset\">Asset class<\u002Foption><option value=\"none\">Single series<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:5px\">\n                <label style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Outliers<\u002Flabel>\n                <sc-raw-select value=\"{{ cOut }}\" sc-camel-on-change=\"{{ onCOut }}\" style=\"height:30px;min-width:180px;border:1px solid #dcdcd6;border-radius:5px;padding:0 6px;font-size:12.5px;background:#fff\">\n                  <option value=\"keep\">Keep all points<\u002Foption><option value=\"exclude\">Exclude beyond 3×IQR<\u002Foption>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <div style=\"border-left:1px solid #e6e6e2;padding-left:16px;min-width:150px\">\n                <div style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">Pearson r<\u002Fdiv>\n                <div style=\"font-size:26px;font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.03em;margin-top:2px;color:{{ corrColor }}\">{{ corrR }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#a5a59d\">{{ corrN }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"cScatter\" style=\"height:390px;margin-top:14px\"><\u002Fdiv>\n          <\u002Fsection>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"font-size:12.5px;font-weight:600\">Correlation matrices by channel<\u002Fdiv>\n            <div style=\"font-size:11px;color:#8a8a82;margin-bottom:12px\">3×IQR exclusion applied automatically, since a single mispriced listing can swamp a raw correlation.<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px\">\n              <div>\n                <div style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#70706a;margin-bottom:6px\">Real estate<\u002Fdiv>\n                <div id=\"corr_SALE\" style=\"height:220px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#70706a;margin-bottom:6px\">Long-term rental<\u002Fdiv>\n                <div id=\"corr_LTR\" style=\"height:220px\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#70706a;margin-bottom:6px\">Short-term rental<\u002Fdiv>\n                <div id=\"corr_STR\" style=\"height:220px\"><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsection>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(440px,1fr));gap:16px\">\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Long-term rent against implied short-term income<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Markets with a usable sample in both channels<\u002Fdiv>\n              <div id=\"cBar\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n            <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 12px\">\n              <div style=\"font-size:12.5px;font-weight:600\">Real estate price against gross rental yield<\u002Fdiv>\n              <div style=\"font-size:11px;color:#8a8a82;margin-bottom:10px\">Annual rent divided by real estate price<\u002Fdiv>\n              <div id=\"cYield\" style=\"height:300px\"><\u002Fdiv>\n            <\u002Fsection>\n          <\u002Fdiv>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"font-size:12.5px;font-weight:600\">Cross-channel market comparison<\u002Fdiv>\n            <div style=\"font-size:11px;color:#8a8a82\">Confidence is set by the smallest channel sample in that market.<\u002Fdiv>\n            <div style=\"overflow:auto;max-height:520px;margin-top:10px\"><sc-raw-table id=\"cTable\" style=\"width:100%;border-collapse:collapse\"><\u002Fsc-raw-table><\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isMap }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <h1 style=\"font-size:20px;font-weight:600;letter-spacing:-.015em\">Listing map<\u002Fh1>\n            <p style=\"font-size:12.5px;color:#70706a;margin-top:5px;max-width:820px;text-wrap:pretty\">Only real property GPS is plotted. Centroid-derived coordinates are excluded. Shape marks the channel (circle = real estate, square = long-term rental, triangle = short-term rental), bubble size scales with price, color marks asset class. Scroll to zoom, drag to pan.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:12px 14px\">\n                <div style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">{{ k.l }}<\u002Fdiv>\n                <div style=\"font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;margin-top:6px;line-height:1.2;font-size:{{ k.fs }}\">{{ k.v }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#a5a59d;margin-top:3px\">{{ k.s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px\">\n              <div>\n                <div style=\"font-size:12.5px;font-weight:600\">Geolocated listings<\u002Fdiv>\n                <div style=\"font-size:11px;color:#8a8a82\">{{ mapNote }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:flex-end\">\n                <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ mapChanChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ c.on }}\" style=\"cursor:pointer;user-select:none;display:flex;gap:6px;align-items:center;font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid {{ c.bd }};background:{{ c.bg }};color:{{ c.fg }};white-space:nowrap\">\n                      <span style=\"width:9px;height:9px;flex:none;{{ c.shapeStyle }}\"><\u002Fspan>{{ c.label }}\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ assetLegend }}\" as=\"a\" hint-placeholder-count=\"6\">\n                    <div style=\"display:flex;gap:5px;align-items:center;font-size:10.5px;color:#70706a;white-space:nowrap\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{ a.color }}\"><\u002Fspan>{{ a.name }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ onMapReset }}\" style=\"height:26px;padding:0 10px;border:1px solid #dcdcd6;background:#fff;border-radius:5px;font-size:11px;color:#3d3d38;cursor:pointer\" style-hover=\"background:#f4f4f2\">Reset view<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"map\" style=\"height:540px;border:1px solid #ecece8;border-radius:6px;overflow:hidden\"><\u002Fdiv>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isData }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:18px\">\n          <div>\n            <h1 style=\"font-size:20px;font-weight:600;letter-spacing:-.015em\">Raw data<\u002Fh1>\n            <p style=\"font-size:12.5px;color:#70706a;margin-top:5px;max-width:820px;text-wrap:pretty\">The current filter, unaggregated. Click any column to sort. Export writes every filtered row, not just the visible page.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:12px\">\n            <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"3\">\n              <div style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:12px 14px\">\n                <div style=\"font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#8a8a82\">{{ k.l }}<\u002Fdiv>\n                <div style=\"font-weight:500;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;margin-top:6px;line-height:1.2;font-size:{{ k.fs }}\">{{ k.v }}<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#a5a59d;margin-top:3px\">{{ k.s }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <section style=\"background:#fff;border:1px solid #e6e6e2;border-radius:6px;padding:14px 16px 16px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:10px\">\n              <div style=\"font-size:11px;color:#8a8a82\">{{ rawNote }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ onExport }}\" style=\"height:30px;padding:0 12px;border:1px solid #a66c1e;background:#a66c1e;color:#fff;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap\" style-hover=\"background:#8e5c17;border-color:#8e5c17\">Export filtered rows to CSV<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"overflow:auto;max-height:640px\"><sc-raw-table id=\"dTable\" style=\"width:100%;border-collapse:collapse\"><\u002Fsc-raw-table><\u002Fdiv>\n            <sc-if value=\"{{ moreRows }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;justify-content:center;padding-top:12px\">\n                <button sc-camel-on-click=\"{{ onMoreRows }}\" style=\"height:30px;padding:0 14px;border:1px solid #dcdcd6;background:#fff;border-radius:5px;font-size:12px;color:#3d3d38;cursor:pointer\" style-hover=\"background:#f4f4f2;border-color:#c9c9c2\">Show 150 more rows<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fsection>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"font-size:10.5px;color:#a5a59d;line-height:1.7;padding-top:4px;max-width:900px\">Sale and long-term rental figures from public property listings; short-term rental figures from public booking listings. Occupancy is a single weekly cycle, August 2026, provisional. All statistics computed client-side on embedded data with no network access.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;startPage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sale&quot;,&quot;ltr&quot;,&quot;str&quot;,&quot;market&quot;,&quot;land&quot;,&quot;cross&quot;,&quot;map&quot;,&quot;data&quot;],&quot;default&quot;:&quot;sale&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;default&quot;,&quot;compact&quot;],&quot;default&quot;:&quot;default&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Behaviour&quot;},&quot;mapSample&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:8000,&quot;min&quot;:1000,&quot;max&quot;:40000,&quot;step&quot;:1000,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    page: null, dmMarket: '', district: '', market: '', mq: '', mOpen: false, min: '', max: '', dup: '0', assets: [],\n    sVar: 'price', sGroup: 'asset', lVar: 'price', lGroup: 'asset', tVar: 'price', tGroup: 'asset',\n    cChan: 'SALE', cX: 'price', cY: 'perch', cColor: 'asset', cOut: 'keep',\n    cur: 'LKR', areaUnit: 'sqft', mapChans: ['SALE', 'LTR', 'STR'],\n    sortKey: null, sortDir: 1, dKey: null, dDir: 1, dLimit: 150, showSup: false, ready: false\n  };\n\n  SANS = \"system-ui,-apple-system,'Segoe UI',Roboto,sans-serif\";\n  MONO = \"ui-monospace,SFMono-Regular,Menlo,Consolas,monospace\";\n  ASSET = { Apartment: '#4a6484', Villa: '#3f7d6a', Land: '#a66c1e', Farmland: '#6f7f3a', Hotel: '#7a5b86', Other: '#9a9a92' };\n  CHANC = { SALE: '#4a6484', LTR: '#3f7d6a', STR: '#7a5b86' };\n  CHANSHAPE = { SALE: 'circle', LTR: 'square', STR: 'triangle' };\n  ACC = '#a66c1e';\n  FX = { LKR: 1, INR: 1 / 3.6, USD: 1 / 302 };\n  CURSYM = { LKR: 'Rs', INR: '₹', USD: '$' };\n  AREAF = { perch: 1, sqft: 272.25, sqm: 25.2929 };\n  curUnit() { return this.state.cur || 'LKR'; }\n  areaUnitLabel() { return { perch: 'perch', sqft: 'sqft', sqm: 'sqm' }[this.state.areaUnit || 'sqft']; }\n  areaAbbr() { return { perch: 'P', sqft: 'sqft', sqm: 'sqm' }[this.state.areaUnit || 'sqft']; }\n  ppLabel() { return { perch: 'price per perch', sqft: 'PPSF', sqm: 'PPSM' }[this.state.areaUnit || 'sqft']; }\n  ppLabelLower() { const u = this.state.areaUnit || 'sqft'; return u === 'perch' ? 'price per perch' : this.ppLabel(); }\n  toArea(perch) { return perch == null ? null : perch * this.AREAF[this.state.areaUnit || 'sqft']; }\n  pxArea(price, perch) { return (price == null || !perch) ? null : price / this.toArea(perch); }\n  BED = ['#dccdb2', '#c9ab77', '#b58f4f', '#a66c1e', '#87571a', '#674113'];\n  TIER = ['#d6d6cf', '#c4b48c', '#b08a45', '#96701f', '#6f5216'];\n  CHNAME = { SALE: 'Real estate', LTR: 'Long-term', STR: 'Short-term' };\n  bedLabel(n) { return n <= 0 ? 'Studio' : n >= 6 ? '6+ BR' : n + ' BR'; }\n  BEDORDER = ['Studio', '1 BR', '2 BR', '3 BR', '4 BR', '5 BR', '6+ BR'];\n  VARS = { price: 'Price', perch: 'Land size (perch)', sqft: 'Floor area (sqft)', beds: 'Bedrooms', occ: 'Occupancy %' };\n  CHAN_VARS = { SALE: ['price', 'perch'], LTR: ['price', 'sqft', 'beds'], STR: ['price', 'occ'] };\n\n  /* ---- statistics, unchanged from the source workbench ---- */\n  med(a) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; }\n  quart(a, q) { if (!a.length) return null; const s = [...a].sort((x, y) => x - y); const p = (s.length - 1) * q, lo = Math.floor(p), hi = Math.ceil(p); return lo === hi ? s[lo] : s[lo] + (s[hi] - s[lo]) * (p - lo); }\n  std(a) { if (a.length < 2) return null; const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((s, his.C; if (!C) return [];\n    const cnt = {}; C.idx.forEach(i => { const m = C.M[C.D.market[i]]; cnt[m] = (cnt[m] || 0) + 1; });\n    return Object.entries(cnt).sort((a, b) => b[1] - a[1]).slice(0, 250).map(e => ({ k: e[0], label: e[0] + '  ·  ' + this.fmtN(e[1]) + ' listings' }));\n  }\n  dmActive() {\n    const o = this.dmOptions(); if (!o.length) return '';\n    return o.some(x => x.k === this.state.dmMarket) ? this.state.dmMarket : o[0].k;\n  }\n  countDonut(id, counts, colorFn, centerLabel, order) {\n    if (!this.el(id)) return;\n    let ent = Object.entries(counts);\n    if (order) ent.sort((a, b) => order.indexOf(a[0]) - order.indexOf(b[0]));\n    VZ.donut(this.el(id), { slices: ent.map(e => ({ name: e[0], value: e[1], color: colorFn(e[0]) })), centerLabel: centerLabel || 'listings' });\n  }\n  pVolume(pfx, ch) {\n    const C = this.C, D = C.D, ii = this.sub(ch);\n    const dc = {}; ii.forEach(i => { const d = C.DI[D.district[i]]; if (d) dc[d] = (dc[d] || 0) + 1; });\n    const top = Object.entries(dc).sort((a, b) => b[1] - a[1]).slice(0, 12);\n    if (this.el(pfx + 'Vol')) VZ.hbar(this.el(pfx + 'Vol'), { cats: top.map(t => t[0]), vals: top.map(t => t[1]), color: this.CHANC[ch],\n      notes: top.map(t => ii.length ? (t[1] / ii.length * 100).toFixed(1) + '%' : ''), emptyMsg: 'No listing in this channel matches the filter' });\n    const ac = {}; ii.forEach(i => { const a = C.A[D.asset[i]]; ac[a] = (ac[a] || 0) + 1; });\n    this.countDonut(pfx + 'Mix', ac, a => this.ASSET[a] || '#9a9a92');\n    if (ch === 'STR' && this.el('tTier')) {\n      const bands = ['Under 20%', '20–40%', '40–60%', '60–80%', '80% and over'], tc = {};\n      ii.forEach(i => { const o = D.occ[i]; if (o == null) return; const k = bands[Math.min(4, Math.floor(o * 5))]; tc[k] = (tc[k] || 0) + 1; });\n      VZ.donut(this.el('tTier'), { slices: bands.filter(b => tc[b]).map((b, k) => ({ name: b, value: tc[b], color: this.TIER[bands.indexOf(b)] })), centerLabel: 'measured' , emptyMsg: 'No measured occupancy in this filter' });\n    }\n  }\n  bedCounts(ii) {\n    const C = this.C, D = C.D, bc = {};\n    ii.forEach(i => { const b = D.beds[i]; if (b == null) return; const k = this.bedLabel(b); bc[k] = (bc[k] || 0) + 1; });\n    return bc;\n  }\n  pBedMix(pfx, ch) {\n    const C = this.C, D = C.D, ii = this.sub(ch);\n    const bc = this.bedCounts(ii);\n    this.countDonut(pfx + 'Bhk', bc, k => this.BED[Math.max(0, this.BEDORDER.indexOf(k) - 1)] || '#9a9a92', 'with beds', this.BEDORDER);\n    this.stackBeds(pfx + 'BhkStack', ii);\n  }\n  stackBeds(id, ii) {\n    if (!this.el(id)) return;\n    const C = this.C, D = C.D, g = {};\n    ii.forEach(i => { const b = D.beds[i]; if (b == null) return; const a = C.A[D.asset[i]], k = this.bedLabel(b); (g[a] = g[a] || {})[k] = (g[a][k] || 0) + 1; });\n    const cats = this.BEDORDER.filter(k => Object.keys(g).some(a => g[a][k]));\n    const assets = Object.keys(g).sort((a, b) => Object.values(g[b]).reduce((x, y) => x + y, 0) - Object.values(g[a]).reduce((x, y) => x + y, 0)).slice(0, 6);\n    VZ.stacked(this.el(id), { cats, series: assets.map(a => ({ name: a, color: this.ASSET[a] || '#9a9a92', vals: cats.map(k => g[a][k] || 0) })), yTitle: 'listings', rotate: false, emptyMsg: 'No listing here reports a bedroom count' });\n  }\n  pMarket() {\n    const C = this.C, D = C.D, mkt = this.dmActive();\n    const ii = C.idx.filter(i => C.M[D.market[i]] === mkt);\n    const ac = {}; ii.forEach(i => { const a = C.A[D.asset[i]]; ac[a] = (ac[a] || 0) + 1; });\n    this.countDonut('mkMix', ac, a => this.ASSET[a] || '#9a9a92');\n    const cc = {}; ii.forEach(i => { const c = this.CHNAME[C.CH[D.channel[i]]]; cc[c] = (cc[c] || 0) + 1; });\n    this.countDonut('mkChan', cc, c => c === 'Sale' ? this.CHANC.SALE : c === 'Long-term' ? this.CHANC.LTR : this.CHANC.STR);\n    this.countDonut('mkBhk', this.bedCounts(ii), k => this.BED[Math.max(0, this.BEDORDER.indexOf(k) - 1)] || '#9a9a92', 'with beds', this.BEDORDER);\n    this.stackBeds('mkBhkStack', ii);\n    const g = {};\n    ii.forEach(i => {\n      const a = C.A[D.asset[i]], b = D.beds[i] == null ? 'Not stated' : this.bedLabel(D.beds[i]), k = a + '|' + b;\n      const row = g[k] = g[k] || { asset: a, beds: b, n: 0, sale: [], rent: [], night: [], sqft: [] };\n      row.n++;\n      const ch = C.CH[D.channel[i]], p = D.price[i];\n      if (p != null) { if (ch === 'SALE') row.sale.push(p); else if (ch === 'LTR') row.rent.push(p); else row.night.push(p); }\n      if (D.sqft[i] > 0) row.sqft.push(D.sqft[i]);\n    });\n    const ord = this.BEDORDER.concat(['Not stated']);\n    const all = Object.values(g).sort((a, b) => b.n - a.n);\n    const rows = all.filter(r => r.n >= 10), sup = all.filter(r => r.n < 10).map(r => ({ market: r.asset, asset: r.beds, n: r.n }));\n    const cols = [['asset', 'Asset', 0], ['beds', 'Bedrooms', 0], ['n', 'Listings', 1], ['sale', 'Median sale', 1], ['rent', 'Median rent', 1], ['night', 'Median nightly', 1], ['sqft', 'Median sqft', 1], ['conf', 'Confidence', 0]];\n    this._tbl = 's';\n    let html = '<thead><tr>' + cols.map(c => this.th(c[0], c[1], c[2])).join('') + '<\u002Ftr><\u002Fthead><tbody>';\n    if (!rows.length) html += this.emptyRow(cols.length, 'No asset and bedroom group reaches n=10 in ' + (mkt || 'this market'), 'Pick a larger micro-market or widen the filter');\n    const cell = arr => arr.length >= 10 ? this.td(this.fmtL(this.med(arr)), 1, 1) : this.td(arr.length ? 'n=' + arr.length : '—', 1, 0, 1);\n    rows.forEach(r => {\n      const hi = r.n >= 30;\n      html += '<tr>' + this.td(r.asset) + this.td(r.beds) + this.td(r.n, 1) + cell(r.sale) + cell(r.rent) + cell(r.night) +\n        (r.sqft.length >= 10 ? this.td(this.fmtN(this.med(r.sqft)), 1) : this.td('—', 1, 0, 1)) +\n        '<td style=\"padding:' + this.rowPad() + ';border-bottom:1px solid #f2f2ee\">' + this.pill(hi ? 'n ≥ 30' : 'n 10–29', hi ? 'hi' : 'md') + '<\u002Ftd><\u002Ftr>';\n    });\n    html += this.supBlock(sup, cols.length, 8);\n    this.mount('mkTable', html + '<\u002Ftbody>', 's');\n  }\n  landRows() {\n    const C = this.C, D = C.D;\n    const items = C.idx.filter(i => C.CH[D.channel[i]] === 'SALE' && (C.A[D.asset[i]] === 'Land' || C.A[D.asset[i]] === 'Farmland'));\n    const withPerch = items.filter(i => D.price[i] != null && D.perch[i] > 0);\n    return { items, withPerch };\n  }\n  pLand() {\n    const C = this.C, D = C.D, L2 = this.landRows(), items = L2.items, wp = L2.withPerch;\n    const byMk = {};\n    items.forEach(i => { const m = C.M[D.market[i]]; (byMk[m] = byMk[m] || { n: 0, ppp: [], perch: [], price: [] }).n++; });\n    wp.forEach(i => { const m = C.M[D.market[i]]; const r = byMk[m]; if (!r) return; r.ppp.push(D.price[i] / D.perch[i]); r.perch.push(D.perch[i]); r.price.push(D.price[i]); });\n    const top = Object.entries(byMk).sort((a, b) => b[1].n - a[1].n).slice(0, 14);\n    if (this.el('lnMk')) VZ.hbar(this.el('lnMk'), { cats: top.map(t => t[0]), vals: top.map(t => t[1].n), color: this.ASSET.Land,\n      notes: top.map(t => t[1].ppp.length >= 10 ? this.fmtL(this.med(t[1].ppp)) + '/' + this.areaAbbr() : 'n<10'), emptyMsg: 'No land listing matches the filter' });\n    const sp = {}; items.forEach(i => { const a = C.A[D.asset[i]]; sp[a] = (sp[a] || 0) + 1; });\n    this.countDonut('lnSplit', sp, a => this.ASSET[a]);\n    const ppp = wp.map(i => this.pxArea(D.price[i], D.perch[i]));\n    if (this.el('lnPerchHist')) VZ.hist(this.el('lnPerchHist'), { series: [{ name: 'Land listings', values: ppp, color: this.ASSET.Land }], bins: 26, fmt: v => this.fmtL(v), xTitle: this.curUnit() + ' per ' + this.areaUnitLabel() });\n    const bandsP = [[0, 5], [5, 10], [10, 20], [20, 40], [40, 80], [80, 160], [160, 1e12]];\n    const u = this.areaUnitLabel();\n    const bands = bandsP.map(b => [b[0], b[1], b[1] >= 1e12 ? this.fmtN(this.toArea(b[0])) + '+ ' + u : this.fmtN(this.toArea(b[0])) + '–' + this.fmtN(this.toArea(b[1])) + ' ' + u]);\n    const bv = bandsP.map(b => wp.filter(i => D.perch[i] >= b[0] && D.perch[i] < b[1]).map(i => this.pxArea(D.price[i], D.perch[i])));\n    if (this.el('lnBand')) VZ.bar(this.el('lnBand'), { cats: bands.map(b => b[2]), vals: bv.map(v => v.length >= 10 ? this.med(v) : null),\n      notes: bv.map(v => 'n=' + v.length), color: this.ASSET.Farmland, fmt: v => this.fmtL(v), yTitle: 'median ' + this.curUnit() + ' / ' + u, emptyMsg: 'No land listing has a usable plot size' });\n    const dd = {}; wp.forEach(i => { const d = C.DI[D.district[i]]; if (d) (dd[d] = dd[d] || []).push(this.pxArea(D.price[i], D.perch[i])); });\n    const dt = Object.entries(dd).filter(e => e[1].length >= 10).sort((a, b) => this.med(b[1]) - this.med(a[1])).slice(0, 15);\n    if (this.el('lnDist')) VZ.bar(this.el('lnDist'), { cats: dt.map(t => t[0]), vals: dt.map(t => this.med(t[1])), notes: dt.map(t => 'n=' + t[1].length), color: this.CHANC.SALE, fmt: v => this.fmtL(v), yTitle: 'median ' + this.curUnit() + ' / ' + u, emptyMsg: 'No district reaches 10 priced land listings' });\n    const smp = wp.length > 1500 ? wp.filter(() => Math.random() < 1500 / wp.length) : wp;\n    const byA = {}; smp.forEach(i => { const a = C.A[D.asset[i]]; (byA[a] = byA[a] || []).push({ x: this.toArea(D.perch[i]), y: D.price[i], label: C.M[D.market[i]] }); });\n    if (this.el('lnScatter')) VZ.scatter(this.el('lnScatter'), { series: Object.entries(byA).map(([a, pts]) => ({ name: a, color: this.ASSET[a], pts })), xLog: true, yLog: true, xTitle: u, yTitle: 'price ' + this.curUnit() });\n    const all = Object.entries(byMk).map(([m, v]) => ({ market: m, asset: '', n: v.n, npr: v.ppp.length, perch: v.perch.length ? this.med(v.perch) : null,\n      price: v.price.length ? this.med(v.price) : null, ppp: v.ppp.length ? this.med(v.ppp) : null,\n      q1: v.ppp.length ? this.quart(v.ppp, .25) : null, q3: v.ppp.length ? this.quart(v.ppp, .75) : null }));\n    const rows = this.sortRows(all.filter(r => r.n >= 10), (a, b) => b.n - a.n);\n    const sup = all.filter(r => r.n < 10).sort((a, b) => b.n - a.n).map(r => ({ market: r.market, asset: '', n: r.n }));\n    const cols = [['market', 'Market', 0], ['n', 'Listings', 1], ['npr', 'With plot size', 1], ['perch', 'Median size', 1], ['price', 'Median price', 1], ['ppp', 'Median ' + this.curUnit() + '/' + this.areaUnitLabel(), 1], ['q1', 'Q1 / ' + this.areaUnitLabel(), 1], ['q3', 'Q3 / ' + this.areaUnitLabel(), 1], ['conf', 'Confidence', 0]];\n    this._tbl = 's';\n    let html = '<thead><tr>' + cols.map(c => this.th(c[0], c[1], c[2])).join('') + '<\u002Ftr><\u002Fthead><tbody>';\n    if (!rows.length) html += this.emptyRow(cols.length, 'No market reaches 10 land listings', 'Widen the filter to compare land markets');\n    rows.forEach(r => {\n      const hi = r.n >= 30, ok = r.npr >= 10;\n      html += '<tr>' + this.td(r.market) + this.td(r.n, 1) + this.td(r.npr, 1) +\n        this.td(r.perch != null ? this.fmtN(this.toArea(r.perch)) + ' ' + this.areaAbbr() : '—', 1, 0, r.perch == null) + this.td(this.fmtL(r.price), 1) +\n        (ok ? this.td(this.fmtL(r.ppp), 1, 1) : this.td('—', 1, 0, 1)) + (ok ? this.td(this.fmtL(r.q1), 1) : this.td('—', 1, 0, 1)) + (ok ? this.td(this.fmtL(r.q3), 1) : this.td('—', 1, 0, 1)) +\n        '<td style=\"padding:' + this.rowPad() + ';border-bottom:1px solid #f2f2ee\">' + this.pill(hi ? 'n ≥ 30' : 'n 10–29', hi ? 'hi' : 'md') + '<\u002Ftd><\u002Ftr>';\n    });\n    html += this.supBlock(sup, cols.length, 9);\n    this.mount('lnTable', html + '<\u002Ftbody>', 's');\n  }\n  exportCSV() {\n    const C = this.C, D = C.D;\n    const h = ['channel', 'district', 'market', 'asset_class', 'price_lkr', 'bedrooms', 'built_sqft', 'land_perches', 'occupancy', 'real_gps', 'duplicate_flag'];\n    const lines = [h.join(',')];\n    C.idx.forEach(i => lines.push([C.CH[D.channel[i]], C.DI[D.district[i]], '\"' + C.M[D.market[i]] + '\"', C.A[D.asset[i]], D.price[i] ?? '', D.beds[i] ?? '', D.sqft[i] ?? '', D.perch[i] ?? '', D.occ[i] ?? '', D.realgeo[i], D.dup[i]].join(',')));\n    const b = new Blob([lines.
